[package]
name = "violin"
version = "0.0.1"
edition = "2024"

# Windows 构建时把 assets/violin.ico 嵌入为可执行文件图标
# 非 Windows 目标下 winres 是空操作 不影响 Linux/macOS 构建
[build-dependencies]
winres = "0.1"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
# 固定到 1.2.4，避免使用 1.2.5
mio = "=1.2.4"
bytes = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crc32fast = "1"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
uuid = { version = "1.29.2", features = ["v3"] }
md-5 = "0.10"
sysinfo = "0.40.3"

# 单候选时 Tab 不再退回原始输入 补丁在 vendor/rustyline/src/lib.rs 的 complete_line
[patch.crates-io]
rustyline = { path = "vendor/rustyline" }
