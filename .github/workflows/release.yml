name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mojor-linux-x64
            asset_name: mojor-x64
            bin_name: mojor
          
          # Linux ARM64 (交叉编译)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: mojor-linux-arm64
            asset_name: mojor-arm64
            bin_name: mojor
            linker: aarch64-linux-gnu-gcc
          
          # Windows x64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mojor-windows-x64
            asset_name: mojor.exe
            bin_name: mojor.exe
            
          # macOS ARM64 (Apple Silicon M系列芯片)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mojor-macos-arm64
            asset_name: mojor-macos-arm64
            bin_name: mojor

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      # 统一处理 Linux 和 macOS 的打包（打 tar.gz 并赋予执行权限）
      - name: Prepare artifact (Unix)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.asset_name }}
          cd dist
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          rm ${{ matrix.asset_name }}

      # 单独处理 Windows (直接给 exe)
      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.asset_name }}

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*